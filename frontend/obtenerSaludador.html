<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtener saludador</title>
</head>
<body>
    <h1>Obtener Saludador</h1>
    <button onclick="obtener()">Obtener</button>
    <label for="usuario"></label>
    <input type="text" id="usuario" disabled name="usuario">

    <script>
        function obtener(){
            e = document.getElementById("usuario");

            url = "http://localhost:8081/obtenerSaludador"
            fetch(url)
            .then( async respuesta => {
                r = await respuesta.json();
                e.value = r.contenido;
                console.log(r);
                return r;
            })
            .catch( error => {
                console.log(error);
            })
        }
    </script>
    
</body>
</html>
